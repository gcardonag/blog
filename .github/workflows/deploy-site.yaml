name: Deploy Site
on:
  push:
  pull_request:

jobs:
  test:
    name: Build and Test Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: my-blog/yarn.lock
      - name: Install dependencies
        working-directory: my-blog
        run: yarn install --frozen-lockfile
      - name: Build and verify the site
        working-directory: my-blog
        # Builds against the fixture Craft server in test/, so this needs no
        # Craft credentials and runs the same on pull requests.
        run: yarn test
      - name: Report known vulnerable dependencies
        working-directory: my-blog
        # Advisory data changes daily, so this reports without failing the
        # build.
        continue-on-error: true
        run: yarn audit
  deploy_content:
    name: Deploy Content
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The same build-from-Craft-and-upload job that runs on a schedule, so a
    # code change on main is published immediately rather than at the next
    # scheduled run.
    uses: ./.github/workflows/publish-content.yaml
    secrets: inherit
  deploy_site:
    name: Deploy Site
    needs: deploy_content
    runs-on: ubuntu-latest
    container: hashicorp/terraform:light
    steps:
      - uses: actions/checkout@v1
      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_TF }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_TF }}
        run: |
          cd terraform/
          terraform init -input=false
          terraform apply -input=false -auto-approve
