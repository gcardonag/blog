name: Deploy Site
on:
  push:
  pull_request:

jobs:
  test:
    name: Build and Test Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/lambda-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: terraform/lambda-publisher/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build, package and verify
        # Builds the site and packages the Lambda against the fixture Craft
        # server in test/, then checks the pages and runs the packaged Lambda
        # against an in-memory bucket. Needs no Craft or AWS credentials, so
        # it runs the same on pull requests.
        run: yarn test
      - name: Report known vulnerable dependencies
        # Advisory data changes daily, so this reports without failing the
        # build.
        continue-on-error: true
        run: yarn audit
  deploy:
    name: Deploy Infrastructure and Publish
    needs: test
    # Only the default branch deploys; pushes to other branches and pull
    # requests stop after the test job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_TF }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_TF }}
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: terraform/lambda-publisher/yarn.lock
      - name: Package the Lambda
        working-directory: terraform/lambda-publisher
        run: |
          yarn install --frozen-lockfile
          yarn package
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14"
          # Plain stdout, so `terraform output -raw` can be captured below.
          terraform_wrapper: false
      - name: Apply Terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
      - name: Build and publish the site
        # Every deploy from main builds the site from the latest Craft content
        # with the code just deployed; the EventBridge schedule keeps doing so
        # between deploys. Fails the deploy if the build or upload fails.
        run: |
          function_error=$(aws lambda invoke \
            --function-name "$(terraform output -raw publisher_function_name)" \
            --cli-read-timeout 180 \
            --query FunctionError --output text \
            response.json)
          cat response.json; echo
          test "$function_error" = "None"
