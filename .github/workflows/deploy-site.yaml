name: Deploy Site
on:
  push:
  pull_request:

jobs:
  test:
    name: Build and Test Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: my-blog/yarn.lock
      - name: Install dependencies
        working-directory: my-blog
        run: yarn install --frozen-lockfile
      - name: Build and verify the site
        working-directory: my-blog
        run: yarn test
      - name: Report known vulnerable dependencies
        working-directory: my-blog
        # Advisory data changes daily and every remaining finding is a
        # build-time transitive dependency, so this reports without failing
        # the build.
        continue-on-error: true
        run: yarn audit
  build:
    name: Build Gatsby Docker Image
    needs: test
    # Only the default branch deploys; pushes to other branches and pull
    # requests stop after the test job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Build
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          docker login -u gcardona -p ${DOCKER_TOKEN}
          docker pull gcardona/blog-gatsby
          docker build --file Dockerfile -t gcardona/blog-gatsby .
          docker push gcardona/blog-gatsby
  deploy_content:
    name: Deploy Content
    needs: build
    runs-on: ubuntu-latest
    container: gcardona/blog-gatsby
    steps:
      - uses: actions/checkout@v1
      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_GATSBY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_GATSBY }}
        run: |
          cd my-blog/
          yarn install --frozen-lockfile
          # `yarn test` builds the site and then verifies the output, so what
          # gets deployed below is exactly what was verified.
          yarn test
          yarn deploy -y
  deploy_site:
    name: Deploy Site
    needs: deploy_content
    runs-on: ubuntu-latest
    container: hashicorp/terraform:light
    steps:
      - uses: actions/checkout@v1
      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_TF }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_TF }}
        run: |
          cd terraform/
          terraform init -input=false
          terraform apply -input=false -auto-approve
